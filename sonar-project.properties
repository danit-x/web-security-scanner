# sonar-project.properties: EC4206 QA phase 11 (static analysis metrics).
# Read by SonarCloud (GitHub Actions job "sonar" in .github/workflows/qa.yml)
# and by the local SonarQube fallback (qa/11-metrics/run-sonar-local.sh).
# No token here: the repo is public. SonarCloud reads SONAR_TOKEN from a
# GitHub Actions secret; the local run passes it on the command line.

# SonarCloud project and organization keys (shown on sonarcloud.io after the
# repo is imported). The local SonarQube run ignores the organization.
sonar.projectKey=danit-x_web-security-scanner
sonar.organization=danit-x
sonar.projectName=Website Security Scanner (EC4206 QA)

# Application code: the Express API and the React client.
sonar.sources=server,client/src
sonar.exclusions=**/node_modules/**,server/tests/**,client/dist/**,**/*.test.js

# Test code: original node:test tests, Jest suite, white-box basis paths, BDD steps.
sonar.tests=server/tests,qa/05-unit,qa/04-white-box/tests,qa/06-bdd
sonar.test.inclusions=**/*.test.js,qa/06-bdd/**/*.js

# Coverage: Jest lcov (Phase 5/8). jest.config.js writes it relative to
# server/, so CI and the local script prefix each SF: line with "server/"
# before analysis (see qa/11-metrics/fix-lcov-paths.js).
sonar.javascript.lcov.reportPaths=qa/evidence/coverage/jest/lcov.sonar.info
# Same exclusions as Jest collectCoverageFrom. The React client has no unit
# tests (it is covered by the Selenium UI suite, which produces no lcov), so it
# is left out of the coverage figure instead of reported as 0 %.
sonar.coverage.exclusions=client/**,server/server.js,server/scripts/**,server/jest.config.js,server/cucumber.js

sonar.sourceEncoding=UTF-8
